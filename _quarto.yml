# One source (index.qmd) -> two outputs:
#   _site/index.html   readable web page (share this link in the chat)
#   _site/slides.html  reveal.js deck   (present this one)
project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - pictures/
    - media/
    - figures/

bibliography: references.bib
csl: ieee.csl
link-citations: true

filters:
  - filters/hybrid.lua

format:
  html:
    output-file: index.html
    theme: [cosmo, theme/page.scss]
    css: theme/components.css
    toc: true
    toc-location: left
    toc-title: "Talk outline"
    toc-depth: 2
    lightbox: true
    include-after-body: theme/l42i-footer.html
    citations-hover: true
    smooth-scroll: true
    format-links: false
    other-links:
      - text: "Open the slides"
        href: slides.html
        icon: easel
      - text: "MËSH on GitHub"
        href: https://github.com/L42i/MESH
        icon: github

  revealjs:
    output-file: slides.html
    theme: [default, theme/slides.scss]
    css: theme/components.css
    include-after-body: theme/footer-logo.html
    # 16:9 at a size that survives video-call compression
    width: 1600
    height: 900
    margin: 0.05
    slide-number: c/t
    show-slide-number: all
    hash: true
    history: false
    # global cross-dissolve between slides (speed: slow | default | fast)
    transition: fade
    transition-speed: default
    background-transition: fade
    controls: true
    progress: true
    preview-links: false
    citations-hover: true
    footer: '[[Lab for Interaction & Immersion]{.f-left}](https://l42i.music.gatech.edu/) [![](pictures/l42i.png){.l42i-logo fig-alt="L42i"}](https://l42i.music.gatech.edu/) [[From SPRAWL to MËSH · SMC 2026]{.f-right}](https://l42i.music.gatech.edu/)'
    # On narrow screens the deck becomes a scrolling page automatically;
    # append ?view=scroll to the URL to force it.
    scroll-view:
      activate: false
      layout: full
