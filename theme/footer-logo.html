<script>
  // Reveal lazy-loads via data-src, but the footer is outside the slides: load it ourselves.
  document.querySelectorAll(".reveal .footer img[data-src]").forEach(function (i) { i.src = i.dataset.src; });
</script>
<script>
  // Goat Farm carousel: items are fragments, so Right/Left already step through them.
  // This syncs the dots, wires the buttons and pauses the video when it is not showing.
  (function () {
    function init() {
      var root = document.querySelector(".reveal .carousel");
      if (!root || !window.Reveal) return;
      var dots = root.querySelectorAll(".cs-dot");
      var frame = root.querySelector("iframe");
      var n = dots.length;
      function current() { var f = Reveal.getIndices().f; return (f === undefined ? -1 : f) + 1; }
      function sync() {
        var c = Math.max(0, Math.min(n - 1, current()));
        dots.forEach(function (d, i) { d.classList.toggle("on", i === c); });
        if (frame && c !== n - 1 && frame.contentWindow) {
          frame.contentWindow.postMessage(JSON.stringify({ event: "command", func: "pauseVideo", args: "" }), "*");
        }
      }
      root.querySelector(".cs-next").addEventListener("click", function () { Reveal.nextFragment(); });
      root.querySelector(".cs-prev").addEventListener("click", function () { Reveal.prevFragment(); });
      dots.forEach(function (d, i) { d.addEventListener("click", function () { Reveal.navigateFragment(i - 1); }); });
      ["fragmentshown", "fragmenthidden", "slidechanged"].forEach(function (e) { Reveal.on(e, function () { setTimeout(sync, 0); }); });
      sync();
    }
    if (window.Reveal && Reveal.isReady && Reveal.isReady()) init(); else if (window.Reveal) Reveal.on("ready", init); else window.addEventListener("load", function () { Reveal.on("ready", init); });
  })();
</script>
